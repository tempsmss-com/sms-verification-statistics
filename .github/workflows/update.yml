name: Monthly snapshot

on:
  schedule:
    - cron: "17 6 1 * *" # 06:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Append the latest figures
        run: python3 scripts/update.py

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain -- data README.md)" ]; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "TempSMSS"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md
          git commit -m "Snapshot $(date -u +%Y-%m-%d)"
          git push
